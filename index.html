<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latihan Ujian BCA</title>
<link rel="icon" type="image/png" href="Assets/bca.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background-color: #E3E3E3;
    }

    .container {
        width: 90%;
        max-width: 1300px;
        margin: auto;
        padding: 20px 0;
    }

    .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .tab-btn {
        background-color: #007bff;
        padding: 8px 18px;
        border-radius: 5px;
        border: none;
        cursor: pointer;
        color: white;
        font-size: 14px;
        transition: 0.3s;
    }

    .tab-btn:hover, .tab-btn.active {
        background-color: #0056c4;
    }

    .card-wrapper {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
    }

    .card {
        background: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        transition: 0.3s ease;
    }

    .card img {
        width: 100%;
        height: 160px;
        object-fit: cover;
    }

    .card-body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 18px;
        height: 120px;
    }

    .card-title {
        font-size: 19px;
        font-weight: 600;
        color: #456882;
        margin: 0 0 15px 0;
    }

    .card-text {
        font-size: 14px;
        margin: 10px 0;
        color: #444;
    }

    .btn-card {
        align-self: flex-start;
        padding: 9px 16px;
        background-color: #234C6A;
        color: #fff;
        text-decoration: none;
        border-radius: 6px;
        font-size: 14px;
        transition: 0.3s;
        margin-top: auto;
    }
    @media(max-width: 500px) {
        .card img {
            height: 140px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div class="tabs">
        <h2>Latihan Ujian BCA</h2>
    </div>

    <div class="card-wrapper" id="cardContainer">
        <div class="card" data-category="second">
            <img src="Assets/solay.jpg">
            <div class="card-body">
                <h3 class="card-title">Solusi Layanan</h3>
                <a href="Solay/index.html" class="btn-card" disabled>Start</a>
            </div>
        </div>
        <div class="card" data-category="third">
            <img src="Assets/hukum.jpg">
            <div class="card-body">
                <h3 class="card-title">Hukum Operasional Bank</h3>
                <a href="Hukum/index.html" class="btn-card">Start</a>
            </div>
        </div>
        <div class="card" data-category="custom">
            <img src="Assets/kpr.jpg">
            <div class="card-body">
                <h3 class="card-title">Kartu kredit, KSM, KPR, KKB</h3>
                <!-- <a href="#" class="btn-card">Start</a> -->
                 <em><h4 style="color: gray;">Comming Soon</h4></em>
            </div>
        </div>
        <div class="card" data-category="custom">
            <img src="Assets/kkb.jpg">
            <div class="card-body">
                <h3 class="card-title">KPR & KKB</h3>
                <!-- <a href="#" class="btn-card">Start</a> -->
                 <em><h4 style="color: gray;">Comming Soon</h4></em>
            </div>
        </div>
        <div class="card" data-category="custom">
            <img src="Assets/apu.jpeg">
            <div class="card-body">
                <h3 class="card-title">APU PPT</h3>
                <!-- <a href="#" class="btn-card">Start</a> -->
                 <em><h4 style="color: gray;">Comming Soon</h4></em>
            </div>
        </div>

    </div>

</div>
</body>
</html>
